# Builds the Windows installer (StudyTerminal-Setup-<version>.exe) on GitHub's free Windows machines,
# so you don't have to build it on your own PC. Free for public repos and within the free monthly minutes for private ones.
# It runs on every push to main (and from the Actions tab: "Build Windows installer" > Run workflow).
# The finished installer appears on the repo's Releases page: a normal release when BUILD equals VERSION in
# backend/app/config.py (for example 0.13.0), otherwise a numbered pre-release.
name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Inno Setup (install only if missing)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
      - name: Python packages
        shell: pwsh
        run: ./scripts/setup.ps1
      - name: Tests (reported, but they don't stop the installer from being built)
        continue-on-error: true
        shell: pwsh
        run: |
          cd backend
          ./.venv/Scripts/python.exe -m pytest -p no:warnings tests -q
      - name: Build, self-test and package
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: StudyTerminal-Setup
          path: dist-installer/*.exe
          if-no-files-found: error
      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path backend/app/config.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          $b = (Select-String -Path backend/app/config.py -Pattern '^BUILD = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          "build=$b" >> $env:GITHUB_OUTPUT
          if ($b -eq $v) {
            "tag=v$v" >> $env:GITHUB_OUTPUT; "name=Study Terminal $v" >> $env:GITHUB_OUTPUT; "pre=false" >> $env:GITHUB_OUTPUT
          } else {
            "tag=v$v-build${{ github.run_number }}" >> $env:GITHUB_OUTPUT
            "name=Study Terminal $b (build ${{ github.run_number }})" >> $env:GITHUB_OUTPUT; "pre=true" >> $env:GITHUB_OUTPUT
          }
      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.ver.outputs.name }}
          prerelease: ${{ steps.ver.outputs.pre }}
          make_latest: ${{ steps.ver.outputs.pre == 'false' }}
          body: |
            Windows installer built automatically from commit ${{ github.sha }}.
            Download StudyTerminal-Setup-${{ steps.ver.outputs.version }}.exe below and run it.
            It isn't code-signed, so Windows shows "Windows protected your PC" once: click More info, then Run anyway.
            Practice only: Study Terminal can't place real orders. Your data folder is kept when you update.
          files: dist-installer/*.exe

  # Windows reliability: installs and runs the installer that was just built on a clean Windows machine.
  # Fresh install, upgrade from the previous release with data, backup and restore, clean shutdown, logs, uninstall keeps data,
  # installer rollback after a failed setup, and a damaged data file. Results: the "windows-reliability" artifact.
  reliability:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PREVIOUS: v0.13.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: StudyTerminal-Setup
          path: new-installer
      - name: Run the reliability checks
        shell: pwsh
        run: ./scripts/windows-reliability.ps1 -NewInstaller (Get-ChildItem new-installer/*.exe)[0].FullName -Previous $env:PREVIOUS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-reliability
          path: reliability-out/

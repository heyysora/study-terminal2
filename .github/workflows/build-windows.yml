# Builds the Windows installer (StudyTerminal-Setup-<version>.exe) on GitHub's free Windows machines,
# so you don't have to build it on your own PC. Free for public repos and within the free monthly minutes for private ones.
# Run it from the repo's Actions tab ("Build Windows installer" > Run workflow), or push a tag like v0.12.0.
name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Inno Setup (install only if missing)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
      - name: Python packages
        shell: pwsh
        run: ./scripts/setup.ps1
      - name: Tests (reported, but they don't stop the installer from being built)
        continue-on-error: true
        shell: pwsh
        run: |
          cd backend
          ./.venv/Scripts/python.exe -m pytest -p no:warnings tests -q
      - name: Build, self-test and package
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: StudyTerminal-Setup
          path: dist-installer/*.exe
          if-no-files-found: error
      - name: Attach to the release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installer/*.exe
